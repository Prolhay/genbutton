name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project files
        run: |
          if [ ! -d app ]; then
            mkdir -p app/src/main/java/com/example/mapoverlay
            mkdir -p app/src/main/res/drawable app/src/main/res/values
            for f in build.gradle*.kts; do
              if grep -q namespace "$f"; then cp "$f" /tmp/app.kts; else cp "$f" /tmp/root.kts; fi
            done
            cp /tmp/root.kts build.gradle.kts
            cp /tmp/app.kts app/build.gradle.kts
            mv AndroidManifest.xml app/src/main/
            mv MainActivity.kt OverlayService.kt app/src/main/java/com/example/mapoverlay/
            mv ic_close.xml ic_launcher.xml ic_map.xml app/src/main/res/drawable/
            mv strings.xml app/src/main/res/values/
          fi
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: map-overlay-apk
          path: app/build/outputs/apk/debug/app-debug.apk
